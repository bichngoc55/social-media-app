services:
  postgres:
    image: postgres:16
    container_name: loopy_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopy}
      POSTGRES_DB: ${POSTGRES_DB:-loopydb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - loopy_data:/var/lib/postgresql/data

volumes:
  loopy_data:
